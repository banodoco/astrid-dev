name: Observation
description: Something in Astrid that looked wrong, slow or awkward (no keys, tokens or private paths).
title: "observation: "
labels: ["observation"]
body:
  - type: textarea
    id: what
    attributes:
      label: What I saw
      description: What you saw; one sentence is enough.
    validations:
      required: true
  - type: input
    id: about
    attributes:
      label: About
      description: "A plan number or gap ID, if you know it. Leave empty if you are not sure."
  - type: input
    id: version
    attributes:
      label: Astrid version
      description: "Optional: the Astrid version you run."
