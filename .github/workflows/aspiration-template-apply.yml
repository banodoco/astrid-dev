name: Apply optional aspiration guidance template
on:
  push:
    branches: [fix/aspiration-guidance-template-20261114]
    paths: [.github/workflows/aspiration-template-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aspiration-guidance-template-20261114
      - name: Apply scoped source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.')
          (r/'vision/templates/aspiration.md').write_text('''### Aspiration title

          One sentence explaining what should be true for this aspiration.

          Explain the aspiration with at least fifteen words of substantive prose, including practical implications, boundaries, examples or tradeoffs that help guide decisions.

          **We should:**

          - State a concrete choice a developer could reasonably have made differently.

          **We should never:**

          - State a boundary that an implementation must not cross.
          ''')
          p=r/'vision/templates/subject.md';s=p.read_text();assert '## Aspirations\n' in s
          s=s.replace('## Aspirations\n', '''## Aspirations

          <!-- Use [the aspiration template](aspiration.md) for each item below. The
          summary is always visible; its substantive explanation expands first. Optional
          We should / We should never lists live behind a separate, initially closed
          "We should / We should never" toggle inside that explanation. Keep both lists
          with 1-5 single-sentence bullets each, or omit both completely. Do not add empty
          placeholders or move these decisions into a separate App-only copy. -->
          ''')
          assert 'This paragraph stays hidden until the reader expands the aspiration.\n' in s
          s=s.replace('This paragraph stays hidden until the reader expands the aspiration.\n', '''This paragraph stays hidden until the reader expands the aspiration.

          **We should:**

          - State a concrete choice that advances this aspiration in practice.

          **We should never:**

          - State a meaningful boundary that protects this aspiration from compromise.
          ''');p.write_text(s)
          p=r/'docs/contribution-workflow.md';s=p.read_text();old='using [the element template](../vision/templates/subject.md);';assert old in s
          p.write_text(s.replace(old,'using [the element template](../vision/templates/subject.md) and [the aspiration template](../vision/templates/aspiration.md);'))
          p=r/'scripts/test_vision_subject.py';s=p.read_text();idx=s.index('    def test_wrong_section_order_is_rejected')
          s=s[:idx]+'''    def test_aspiration_template_supports_optional_paired_guidance(self):
                  template = (ROOT / "vision/templates/aspiration.md").read_text(encoding="utf-8")
                  old = SAMPLE[SAMPLE.index("### Agency"):SAMPLE.index("### Continuity")]
                  with_guidance = parse_subject(SAMPLE.replace(old, template + "\\n"), "template.md")
                  details = with_guidance["characteristics"][0]["detailsMarkdown"]
                  self.assertIn("**We should:**", details)
                  self.assertIn("**We should never:**", details)
                  without = template.partition("**We should:**")[0].rstrip() + "\\n\\n"
                  no_guidance = parse_subject(SAMPLE.replace(old, without), "template-without-guidance.md")
                  self.assertNotIn("We should", no_guidance["characteristics"][0]["detailsMarkdown"])
                  self.assertEqual(with_guidance["characteristics"][0]["summary"],
                                   no_guidance["characteristics"][0]["summary"])

          '''+s[idx:];p.write_text(s)
          PY
          python3 scripts/astrid_dev.py check
          PYTHONPATH=scripts python3 -m unittest scripts/test_vision_subject.py scripts/test_export_public_vision.py
          git diff --check
          git add vision/templates/aspiration.md vision/templates/subject.md docs/contribution-workflow.md scripts/test_vision_subject.py
          git config user.name 'POM'
          git config user.email 'peter@omalley.io'
          git commit -m 'docs(vision): template optional aspiration decision guidance'
          git push origin HEAD:fix/aspiration-guidance-template-20261114
