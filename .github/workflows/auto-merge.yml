name: Merge planning pull requests when checks pass

# Trusted main code only; PR contents and metadata are API data, never executed.
on:
  pull_request_target:
    # Also reconcile a draft hold after auto-merge was enabled.
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled, edited, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: vars.AUTO_MERGE_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Create dedicated auto-merge App token
        id: merge-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: write
      - name: Reconcile planning auto-merge
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          APP_SLUG: ${{ steps.merge-token.outputs.app-slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          pr="$RUNNER_TEMP/auto-merge-pr.json"
          files="$RUNNER_TEMP/auto-merge-files.json"
          latest="$RUNNER_TEMP/auto-merge-latest.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$files"
          decision="$(python3 scripts/auto_merge.py --pr "$pr" --files "$files")"
          echo "$decision"
          # Refuse a stale snapshot if metadata or the head changed during pagination.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$latest"
          if ! cmp -s <(jq -S '{head: .head.sha, base: .base.sha, draft, author_association, labels, body, changed_files, auto_merge, state, updated_at}' "$pr") \
                      <(jq -S '{head: .head.sha, base: .base.sha, draft, author_association, labels, body, changed_files, auto_merge, state, updated_at}' "$latest"); then
            echo "PR changed during inspection; a newer event must reconcile it." >&2
            exit 1
          fi
          if [ "$(jq -r .state "$pr")" != open ]; then
            exit 0
          fi
          node_id="$(jq -r .node_id "$pr")"
          if [ "$decision" = eligible ]; then
            if jq -e '.auto_merge != null' "$pr" >/dev/null; then
              exit 0
            fi
            # This mutation only enables squash auto-merge; required checks and
            # reviews still gate merging. Never call mergePullRequest/gh pr merge.
            gh api graphql -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { pullRequest { number } } }' -f id="$node_id" || {
              # GitHub refuses auto-merge on a pull request that is already mergeable
              # (its checks passed before it became eligible). Say so; never merge directly.
              echo "::warning::Could not enable auto-merge; if the checks have already passed, merge this pull request by hand."
            }
          # enabled_by identifies the enabling actor, not the PR author. Reserve
          # this App for this workflow: its Bot login is our identity. A person's
          # request (or an absent/unknown actor) is never disabled or replaced.
          elif jq -e --arg bot "${APP_SLUG}[bot]" \
            '.auto_merge.enabled_by.type == "Bot" and .auto_merge.enabled_by.login == $bot' "$pr" >/dev/null; then
            gh api graphql -f query='mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { pullRequest { number } } }' -f id="$node_id"
          fi
