name: Plan 53 record and review fixes

on:
  push:
    branches: [chatgpt/53-vision-aspirations]
    paths: [.github/workflows/plan53-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/chatgpt/53-vision-aspirations'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record the current run without rewriting historical decisions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          line = "[CA-004 — Discovering each other's contributions](../gaps/CA-004-sharing-and-discovery.md) makes reusable work visible to people and their agents.\n\n"
          for name in ('vision/pillars/shared-endeavour.md', 'scripts/fixtures/vision/vision/pillars/shared-endeavour.md.fixture'):
              p = Path(name); text = p.read_text(); assert text.count(line) == 1
              p.write_text(text.replace(line, ''))
          plan = Path('plans/53-vision-aspirations')
          p = plan / 'plan.md'; text = p.read_text()
          old = "**Waiting on:** the owner's mark-up of five aspirations and of the proposed supporting aspirations ([inputs.md](inputs.md#owner-decisions))"
          assert old in text
          p.write_text(text.replace(old, '**Waiting on:** final browser proof and publication; the owner delegated end-to-end implementation and main promotion on 13 November ([execution record](evidence/execution.md))'))
          p = plan / 'inputs.md'; text = p.read_text()
          old = next(line for line in text.splitlines() if line.startswith('**Run start:**'))
          new = '**Run start:** 13 Nov 2026, both phases and the outside-tap dismissal fix, under the owner\'s direct request in the current ChatGPT session: "Can you please execute this end to end across the repos and push to main", followed by "Please do all of that". **Accountable session:** this ChatGPT execution session; no retrievable session identifier or independent reviewer is claimed. **Without asking:** implement the accepted plan using its recommended wording and relationships, fix the popup bug, test and promote the two repositories to main. This supersedes this plan\'s Phase-1-only hold for the requested website/content work; it does not authorize an installer release or change any release pin. **Needs the owner:** any expansion beyond these outcomes. The former wording wait is resolved by delegated implementation, not by inventing personal line-by-line markup. [Evidence and remaining limits](evidence/execution.md).\n\n**Previous run start (historical):**' + old.removeprefix('**Run start:**')
          p.write_text(text.replace(old, new))
          p = plan / 'tasks.md'; text = p.read_text()
          assert 'No run has started. Paths and line numbers were read' in text
          text = text.replace('No run has started. Paths and line numbers were read', 'The 13 Nov run implements both phases under the owner\'s direct end-to-end and main-promotion request; see [current evidence](evidence/execution.md). The original task scopes below remain the acceptance inventory. Paths and line numbers were read', 1)
          text += '''
          ## 13 November execution updates

          The owner delegated the two phases and the dismissal fix together. The implementation uses the accepted primary/supporting mapping and wording recommendations, without claiming personal markup or an independent reviewer. The feed fields and consumer ship together; no intermediate release that renders unstyled lists is needed.

          | Follow-up | Scope and disposition | Proof |
          | --- | --- | --- |
          | VA-12 Outside taps dismiss once | Native dialog stays in the top layer through the final captured click; pointer cancellation, drag and keyboard activation do not dismiss it. | Delayed-click and real-touch tests pass in Chromium and WebKit in the initial candidate run. |
          | R1.1 All linked projects | The new hierarchy counts all primary-linked projects, including finished work with its status; the legacy current-work list stays unchanged. | Unit expectation now includes the completed project; final candidate run pending. |
          | R1.2 Null is not an omitted array | Reject null supporting-aspiration lists while preserving absence for older feeds. | Added negative unit case; final candidate run pending. |
          | R1.3 Discovery has one home | Remove CA-004 from Shared Endeavor references after moving its primary to Open by design. | Element fixture and source updated together; structure and golden checks. |
          | R1.4 Correct test scope | The new disclosure assertion selects the decision-list body, not its bold title. WebKit runs serially with a cold-transform budget, without retries. | Initial traces show the overbroad selector and unresolved cold Vite CSS load, not a failing dismissal. Rerun the same browser inventory. |
          | Baseline test repairs | Mobile goal clamp: fixed five-line assumption becomes the actual responsive CSS budget. Color grouping: a deterministic primary-only fixture replaces an assumption that supporting gaps are duplicated. Layout: expand the existing ten-gap limit before selecting F-003. | These three tests failed on the untouched baseline. No golden line, test or assertion of the intended behavior was removed. |

          Review provenance: the findings above are the implementer's source review, not an independent completion review. Production publication and the owner's physical-device look are not claimed until observed.
          '''
          p.write_text(text)
          p = plan / 'evidence/execution.md'; p.parent.mkdir(exist_ok=True)
          assert not p.exists()
          p.write_text('''# Plan 53 execution evidence

          [Plan](../plan.md) · [Tasks](../tasks.md) · [Inputs](../inputs.md)

          ## Authority and exact scope

          On 13 November 2026 the owner directly requested end-to-end implementation across the repositories, pushes to main, and correction of an outside tap closing one popup and opening another. The later "Please do all of that" confirms the same scope. The accepted plan's recommended wording and supporting mapping are the implementation basis; no personal markup of each sentence is claimed. This is website/content publication only, with no Runtime, Agent, installer manifest, release number, generation route or GPU claim.

          ## Sources and changes

          - Astrid Dev baseline: `4f8893b8c14bdb08d6d516a7c5d6c7a09ceb3aac`; initial implemented source: `4cd164c23bb27bf603128b9a40df984501304ed7`. [Implementation PR](https://github.com/banodoco/astrid-dev/pull/643).
          - Astrid App baseline: `237b28be935af49c23464fa6ca1cf30db67ebaa0`; initial implemented source: `93d0f9ca5e98199979f6d11a8de6c09e05b40642`. [Implementation PR](https://github.com/banodoco/astrid-app/pull/257).
          - Eight element pages hold 31 aspirations. All 22 gaps name exactly one primary aspiration and any supporting aspirations. Only CA-003, CA-004, F-004 and F-008 require changed-boundary receipts; those are in the Dev PR.
          - Source headings and user-facing labels say aspirations. The compatible schema v1 feed retains characteristics, appliesTo and primaryAppliesTo and adds aspiration/supportingAspirations. The golden oracle is unchanged.

          ## Observed checks

          [Initial clean-runner Dev validation](https://github.com/banodoco/astrid-dev/actions/runs/43415979182) passed `python3 scripts/astrid_dev.py check` and nine focused unittest suites, 142 tests. [PR-context validation](https://github.com/banodoco/astrid-dev/actions/runs/43417038073) passed all 332 validator tests; its boundary-note check rejected bold field labels in the PR body. The labels were corrected to the required plain form; the validator was not weakened.

          [App baseline](https://github.com/banodoco/astrid-app/actions/runs/43412111759): 29 unit tests, lint and hosted build passed; 49 browser tests passed and three stale expectations failed. Their exact corrections are recorded in the task updates.

          [Initial paired candidate](https://github.com/banodoco/astrid-app/actions/runs/43416611774): the pre-migration App accepts the candidate feed; new unit tests, lint and hosted build pass. Chromium passes 56 browser cases and fails two new overbroad text selectors. WebKit passes four cases, including real outside touch, delayed final click and real candidate Packs rendering; two hierarchy cases hit the cold Vite transform timeout. These initial failures remain recorded and must be followed by a green rerun, not counted as completion.

          The artifact `plan53-validation` carries exact source revisions, exported candidate feed, unit/browser JSON and screenshots. The implementer inspected the phone hierarchy and real Packs screenshots. That is not a claim of owner visual sign-off or a physical iPhone test.

          ## Remaining publication proof

          The corrected combined candidate, final required checks, merges, published feed and deployed page must be recorded before completion. Plan 53 does not itself close CA-003: the wider execution/evidence trail remains open, and none of its closure-evidence items is silently marked delivered. Release strategy and release assignments are unchanged by this website/content work.

          Routes used: Unknown — a single ChatGPT session performed implementation and source review, without configured route-worker calls or an independent completion reviewer.
          ''')
          PY
      - name: Validate before committing
        run: |
          python3 scripts/astrid_dev.py check
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Commit only to the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- vision/pillars/shared-endeavour.md scripts/fixtures/vision/vision/pillars/shared-endeavour.md.fixture plans/53-vision-aspirations
          git diff --cached --check
          git commit -m 'docs(plan53): record delegated execution and correct discovery reference'
          git push origin HEAD:refs/heads/chatgpt/53-vision-aspirations
