name: Plan 71 isolated native source replay (temporary)

on:
  push:
    branches:
      - p71/recovery-gd9-prep-20261123-1
    paths:
      - "plans/71-gap-definition-reconciliation/evidence/**"
      - ".github/workflows/p71-isolated-native-replay.yml"

permissions:
  contents: read

jobs:
  source-replay:
    if: github.ref == 'refs/heads/p71/recovery-gd9-prep-20261123-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned historical source snapshots
        run: |
          set -euo pipefail
          git fetch --no-tags origin ca97096ba6893108c90a932479e7473f679c724e
          git fetch --no-tags origin 6d75abf9cb0d102a1fef494f78dd9184d4e45d1f
          git fetch --no-tags origin 70d5ac857e8066f8cacf98cda7b9d5d686a12f71
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check ca97096ba6893108c90a932479e7473f679c724e HEAD
      - name: Native C1/C2 parser and source replay
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 plans/71-gap-definition-reconciliation/evidence/gd9_source_replay.py --self-test
          python3 plans/71-gap-definition-reconciliation/evidence/gd9_source_replay.py --repo . --head "$GITHUB_SHA"
      - name: Original repository tests and checks
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/astrid_dev.py check
          python3 scripts/astrid_dev.py sync
          git status --porcelain
