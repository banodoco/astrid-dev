name: Plan 53 workbench

on:
  push:
    branches: [chatgpt/53-vision-aspirations]
    paths: [.github/workflows/plan53-workbench.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrid-dev
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: 237b28be935af49c23464fa6ca1cf30db67ebaa0
          path: astrid-app
          persist-credentials: false
      - name: Package tracked sources for Plan 53 validation
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, zipfile
          manifest = {}
          with zipfile.ZipFile('plan53-sources.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in ('astrid-dev', 'astrid-app'):
                  root = pathlib.Path(name)
                  sha = subprocess.check_output(['git', '-C', name, 'rev-parse', 'HEAD'], text=True).strip()
                  tree = subprocess.check_output(['git', '-C', name, 'rev-parse', 'HEAD^{tree}'], text=True).strip()
                  paths = subprocess.check_output(['git', '-C', name, 'ls-files', '-z']).decode().split('\0')
                  skipped = []
                  for relative in filter(None, paths):
                      p = root / relative
                      if p.is_symlink() or not p.is_file() or p.stat().st_size > 10000000:
                          skipped.append(relative)
                          continue
                      z.write(p, f'{name}/{relative}')
                  manifest[name] = {'commit': sha, 'tree': tree, 'skipped': skipped}
              z.writestr('source-revisions.json', json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: plan53-sources
          path: plan53-sources.zip
          retention-days: 3
