# Default role settings. Copy to OTTO_DIR/run.yaml; explicit user choices override.
# Select completion/consequential boundaries using references/run-config.md.
# Only final is active by default; the commented boundary examples are optional.
# For bulk migration, use implementation readiness before it and completion after;
# when the latter completes the scope, it occupies the final slot below.
# Editing this file does not launch models or authorize implementation.
mode: planning_only  # change to delivery only when implementation is authorized
# Mandatory kickoff choice: ask whether delivery edits the invoking main
# checkout or uses an in-repo worktree at .otto/worktrees/<run-id>.
source_custody: ask  # main | worktree; never create a worktree outside the repo
roles:
  coordinator: {model: gpt-5.6-luna, reasoning: medium}
  worker_normal: {model: gpt-5.6-luna, reasoning: xhigh}
  worker_xhard: {model: gpt-6.1-sol, reasoning: high}
  reviewer_normal: {model: gpt-6-astra, reasoning: medium}
  reviewer_xhard: {model: gpt-6-astra, reasoning: high}
  oracle: {model: gpt-6.1-sol, reasoning: high}
  final_reviewer: {model: gpt-6-astra, reasoning: medium}
oracle: {}
  # No default numeric limit. Consult only for blockers or consequential judgment;
  # an explicit run may add max_calls when its authority/environment requires it.
review_stages:
  - id: final
    after: ALL_REQUIRED_WORK_AND_TESTS
    reviewer_role: final_reviewer
    lens: completion_and_strategy
    scope_tasks: [ALL_REQUIRED_TASK_IDS]
    criteria_source: implementation-criteria.md
    criteria: [ALL_REQUIRED_CRITERION_IDS]
    max_rounds: 5
# Selecting both boundary examples permits at most 9 review calls; oracle calls
# are separate and normally uncapped. Never leave placeholder triggers.
# Stop immediately on uncontested PASS. Explicit user caps override these defaults.
# Use only the final entry for ordinary completion or a user final-only policy.
# Never append an implicit final stage after the declared completion boundary.

